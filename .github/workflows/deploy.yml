name: CDK Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Prevent concurrent deployments — queue them instead
concurrency:
  group: cdk-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION:    eu-west-1
  CDK_ACCOUNT:   835023969708
  PYTHON_VERSION: "3.12"

jobs:

  # ---------------------------------------------------------------- #
  # diff — runs on every PR, shows what infrastructure would change  #
  # ---------------------------------------------------------------- #
  diff:
    name: CDK Diff
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      id-token: write   # required for OIDC
      contents: read
      pull-requests: write  # to post diff as PR comment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Node.js (CDK CLI needs it)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.CDK_ACCOUNT }}:role/GitHubActionsCDKRole
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Diff
        id: cdk_diff
        run: |
          cdk diff --context account=${{ env.CDK_ACCOUNT }} 2>&1 | tee diff_output.txt
          echo "diff_output<<EOF" >> $GITHUB_OUTPUT
          cat diff_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post diff as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const diff = `${{ steps.cdk_diff.outputs.diff_output }}`;
            const body = `## CDK Diff\n\`\`\`\n${diff}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });

  # ---------------------------------------------------------------- #
  # deploy — runs on push to main only                               #
  # ---------------------------------------------------------------- #
  deploy:
    name: CDK Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.CDK_ACCOUNT }}:role/GitHubActionsCDKRole
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Deploy
        run: |
          cdk deploy \
            --context account=${{ env.CDK_ACCOUNT }} \
            --require-approval never \
            --outputs-file cdk-outputs.json

      - name: Upload CDK outputs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdk-outputs
          path: cdk-outputs.json
          retention-days: 30